services:
  db:
    image: postgres:18
    container_name: fde-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YOUR_DOCKER_POSTGRES_PASSWORD
      POSTGRES_DB: fde_customer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fde_customer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: sinthiyak/fde-preparation:latest
    container_name: fde-fastapi
    env_file:
      - .env.docker
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: fde-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data: